[workspace]
members = [
    "crates/kesh-core",
    "crates/kesh-db",
    "crates/kesh-api",
    "crates/kesh-reconciliation",
    "crates/kesh-i18n",
    "crates/kesh-report",
    "crates/kesh-seed",
    "crates/kesh-import",
    "crates/kesh-payment",
    "crates/kesh-qrbill",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/gcorbaz/kesh"

# Profil de développement — réglé pour la MÉMOIRE, pas pour le confort de
# débogage (2026-08-11, après deux OOM ayant emporté des sessions de travail).
#
# Par défaut, `debug = true` demande le DWARF complet : rustc construit et garde
# en mémoire la description de chaque type et de chaque variable, puis le linker
# recopie le tout dans chaque binaire de test. C'est le premier poste de
# consommation d'un `cargo build --workspace --all-targets`, avant même le nombre
# de jobs — et ce workspace produit des dizaines de binaires de test.
#
# CE QU'ON GARDE : `line-tables-only` conserve la correspondance adresse → fichier
# et ligne. Les backtraces de panic (`RUST_BACKTRACE=1`) et les échecs de test
# continuent donc de pointer la bonne ligne, ce qui est l'usage réel au quotidien.
#
# CE QU'ON PERD : l'inspection des variables sous gdb/lldb. Pour une session de
# débogage pas-à-pas, surcharger ponctuellement sans toucher à ce fichier :
#   CARGO_PROFILE_DEV_DEBUG=full cargo test -p kesh-core <test>
[profile.dev]
debug = "line-tables-only"

# Les dépendances tierces : aucune info de debug. On ne débogue pas dans axum ou
# sqlx, et elles pèsent l'essentiel du volume compilé. Gain sur la RAM de linkage
# et sur la taille de `target/`.
[profile.dev.package."*"]
debug = false

# `[profile.test]` hérite de `[profile.dev]` : les réglages ci-dessus couvrent
# `cargo test` et `cargo nextest run` sans avoir à les répéter.
