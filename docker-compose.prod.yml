# =============================================================================
# Kesh — Docker Compose production
# =============================================================================
#
# Compose pour déploiement production (NAS Synology DSM 7.2+ x86_64).
#
# **Pas de service MariaDB bundled** — décision Story 10-1 / Epic 10 D2 :
# l'utilisateur fournit sa propre instance MariaDB 10.11+ (NAS Package Center
# DSM, conteneur externe, ou DB managée).
#
# **Réseau Docker externe** (décision D9) : `frontend` doit exister avant
# `docker compose up`. Pour le créer :
#
#     docker network create frontend
#
# Le service MariaDB (Synology Package Center ou conteneur séparé) doit aussi
# être joignable depuis ce réseau, sinon utiliser l'IP LAN du NAS dans
# `DATABASE_URL` au lieu d'un hostname Docker.
#
# **Sécurité** :
#   - `KESH_HOST=0.0.0.0` (bind interne au container — sans cela, kesh-api
#     écouterait uniquement sur la loopback du container et serait inaccessible
#     même avec port mapping).
#   - `ports: "127.0.0.1:80:80"` (restriction host-side au loopback de
#     l'hôte NAS — accès LAN privé v0.1.0, décision D5). Reverse proxy DSM
#     futur v0.2+ déposera son frontal en façade.
#   - `DATABASE_URL` et `KESH_JWT_SECRET` doivent être définis dans le `.env`
#     user-side (cf. `.env.example`). `KESH_ADMIN_PASSWORD` est OPTIONNEL :
#     absent → l'administrateur se crée à l'écran `/setup` au premier accès ;
#     si posé, ≥ 12 caractères et ≠ `changeme`. Les valeurs insecure —
#     `changeme`, `change-me-32-bytes-...`, le placeholder `<GENERATE_ME: ...>`
#     du gabarit ou toute valeur entre chevrons `<...>` — font fail-fast au boot.
#   - Seules les variables listées sous `environment:` atteignent Kesh ; après
#     une modification de `.env` : `docker compose up -d` (un `restart` ne
#     relit pas `.env`).
#
# **Logs & ressources** :
#   - Log rotation `json-file` 10 MB × 5 fichiers max = 50 MB plafond.
#   - `mem_limit: 1g` protège le NAS d'un runaway (overkill pour usage solo,
#     ajuster si besoin).
#
# Lancement typique :
#
#     # 1. Créer le réseau (une fois)
#     docker network create frontend
#
#     # 2. Configurer .env depuis le template
#     cp .env.example .env
#     # éditer .env : DATABASE_URL, KESH_JWT_SECRET (openssl rand -hex 32)
#     # — KESH_ADMIN_PASSWORD optionnel (sinon onboarding /setup)
#
#     # 3. Démarrer
#     docker compose -f docker-compose.prod.yml up -d
#
#     # 4. Vérifier
#     curl http://127.0.0.1/health
#
# =============================================================================

services:
  kesh-api:
    image: gcorbaz/kesh:latest
    container_name: kesh-api
    restart: unless-stopped
    environment:
      # ⚠️ Seules les variables listées ici atteignent Kesh : Compose lit `.env`
      # pour remplir les `${…}` de ce fichier, sans le transmettre au conteneur.
      # Une variable ajoutée au code doit l'être ici — test `configuration_transmise`.
      # Après une modification de `.env` : `docker compose up -d` (un `restart`
      # ne relit pas `.env`).
      #
      # Base de données — URL exacte fournie par l'utilisateur via .env
      DATABASE_URL: ${DATABASE_URL}

      # Application — KESH_HOST=0.0.0.0 obligatoire pour exposition via
      # port mapping (cf. commentaire ci-dessus).
      KESH_PORT: ${KESH_PORT:-80}
      KESH_HOST: 0.0.0.0

      # Admin initial — OPTIONNEL : absent ou vide → onboarding `/setup` au
      # premier accès (table users vide). Si posé : ≥ 12 chars, ≠ "changeme"
      # (case-insensitive), ni placeholder du gabarit, sinon fail-fast.
      KESH_ADMIN_USERNAME: ${KESH_ADMIN_USERNAME:-admin}
      KESH_ADMIN_PASSWORD: ${KESH_ADMIN_PASSWORD:-}

      # Authentification — KESH_JWT_SECRET OBLIGATOIRE : ≥ 32 chars, sans
      # "change-me" ni "GENERATE_ME", et pas une valeur entre chevrons <...>,
      # sinon fail-fast. Générer : openssl rand -hex 32
      KESH_JWT_SECRET: ${KESH_JWT_SECRET}
      KESH_JWT_EXPIRY_MINUTES: ${KESH_JWT_EXPIRY_MINUTES:-15}
      KESH_REFRESH_TOKEN_MAX_LIFETIME_DAYS: ${KESH_REFRESH_TOKEN_MAX_LIFETIME_DAYS:-30}

      # Session & Rate Limiting
      KESH_REFRESH_INACTIVITY_MINUTES: ${KESH_REFRESH_INACTIVITY_MINUTES:-15}
      KESH_RATE_LIMIT_WINDOW_MINUTES: ${KESH_RATE_LIMIT_WINDOW_MINUTES:-15}
      KESH_RATE_LIMIT_MAX_ATTEMPTS: ${KESH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      KESH_RATE_LIMIT_BLOCK_MINUTES: ${KESH_RATE_LIMIT_BLOCK_MINUTES:-30}

      # Localisation (FR75)
      KESH_LANG: ${KESH_LANG:-fr}

      # Politique mot de passe utilisateur (FR6)
      KESH_PASSWORD_MIN_LENGTH: ${KESH_PASSWORD_MIN_LENGTH:-12}

      # Import bancaire
      KESH_BANK_IMPORT_MAX_MB: ${KESH_BANK_IMPORT_MAX_MB:-10}

      # Logging — stdout/stderr standard Docker
      RUST_LOG: ${RUST_LOG:-info}

      # Logs fichier avec rotation (Story v011-1, Issue #119) — EN PLUS de
      # stdout/`docker logs`. Écrits dans /var/log/kesh (monté sur ./log côté
      # hôte, co-localisé avec .env dans le dossier du compose, que sauvegarde
      # Hyper Backup ; la base, hors de ce compose, se sauvegarde par la
      # tâche de dump planifiée que décrit le manuel).
      # Opt-out : une ligne `KESH_LOG_FILE_PATH=` VIDE dans .env → stdout pur
      # (le mount ./log devient alors inutilisé mais inoffensif). Tiret SANS
      # deux-points : le défaut ne vaut que pour une variable absente de .env.
      KESH_LOG_FILE_PATH: ${KESH_LOG_FILE_PATH-/var/log/kesh/kesh.log}
      KESH_LOG_FILE_ROTATION: ${KESH_LOG_FILE_ROTATION:-daily}
      KESH_LOG_FILE_MAX_FILES: ${KESH_LOG_FILE_MAX_FILES:-7}
      KESH_LOG_FILE_FORMAT: ${KESH_LOG_FILE_FORMAT:-pretty}

      # Import de factures depuis un dossier (Story 12-5, #194) — montés en bind
      # mounts host ci-dessous (déposez vos factures dans ./inbox via File Station).
      KESH_DOCUMENTS_DIR: ${KESH_DOCUMENTS_DIR:-/data/documents}
      KESH_INBOX_DIR: ${KESH_INBOX_DIR:-/data/inbox}
      KESH_INBOX_MAX_FILE_BYTES: ${KESH_INBOX_MAX_FILE_BYTES:-26214400}
      KESH_INBOX_MAX_FILES_PER_RUN: ${KESH_INBOX_MAX_FILES_PER_RUN:-200}
      KESH_INBOX_MAX_PDF_PAGES: ${KESH_INBOX_MAX_PDF_PAGES:-20}

      # Les variables ci-dessous, en `${NOM:-}`, arrivent vides quand `.env` ne les
      # pose pas ou les laisse vides : vide (ou blanc) = défaut du code, sans
      # avertissement (manuel d'administration, § Variables d'environnement).

      # Cookies de session `Secure` (défaut true ; false = HTTP-only LAN strict)
      KESH_COOKIE_SECURE: ${KESH_COOKIE_SECURE:-}

      # E-mails sortants (envoi de factures) et mot de passe oublié par e-mail
      KESH_SMTP_HOST: ${KESH_SMTP_HOST:-}
      KESH_SMTP_PORT: ${KESH_SMTP_PORT:-}
      KESH_SMTP_USER: ${KESH_SMTP_USER:-}
      KESH_SMTP_PASSWORD: ${KESH_SMTP_PASSWORD:-}
      KESH_SMTP_FROM: ${KESH_SMTP_FROM:-}
      KESH_SMTP_TLS: ${KESH_SMTP_TLS:-}
      KESH_PUBLIC_BASE_URL: ${KESH_PUBLIC_BASE_URL:-}
      KESH_FEATURE_FORGOT_PASSWORD: ${KESH_FEATURE_FORGOT_PASSWORD:-}

      # Sortie de la démonstration (réinitialisation d'une installation de démo)
      KESH_PRODUCTION_RESET: ${KESH_PRODUCTION_RESET:-}

      # Export / import d'installation (.keshbackup)
      KESH_ADMIN_BACKUP_DIR: ${KESH_ADMIN_BACKUP_DIR:-}
      KESH_ADMIN_EXPORT_INMEM_MB: ${KESH_ADMIN_EXPORT_INMEM_MB:-}
      KESH_ADMIN_IMPORT_MAX_MB: ${KESH_ADMIN_IMPORT_MAX_MB:-}
    ports:
      # Restriction host-side au loopback NAS (LAN privé v0.1.0, D5).
      # Accès via SSH tunnel ou reverse proxy DSM (futur v0.2+).
      - "127.0.0.1:80:80"
    volumes:
      # Montages fixes : les KESH_*_HOST_DIR de .env sont sans effet ici (issue #558).
      # Logs fichier (Story v011-1) — répertoire host ./log/ relatif au cwd
      # du compose. Créé au 1er boot, owned root:root (le container tourne en
      # root) — cf. warning permissions dans .env.example.
      - ./log:/var/log/kesh
      # Import de factures (Story 12-5, #194) — bind mounts host co-localisés
      # (scope Hyper Backup unique). Déposez vos factures dans ./inbox ; les
      # justificatifs archivés vivent dans ./documents.
      - ./inbox:/data/inbox
      - ./documents:/data/documents
      # Sauvegarde de sécurité prise avant chaque import d'installation (#552) —
      # défaut du code /data/backup, monté ici sur ./backup (montage fixe, sans
      # variable d'hôte). SECRET (condensés des mots de passe, jetons de session) :
      # fichiers en 0600. Dans le périmètre de sauvegarde du dossier du compose
      # (Hyper Backup) ; à purger par l'exploitant (une sauvegarde par import).
      - ./backup:/data/backup
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 1g

networks:
  frontend:
    external: true
