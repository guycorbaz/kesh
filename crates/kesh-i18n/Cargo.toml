[package]
name = "kesh-i18n"
version = "0.13.0"
edition.workspace = true
license.workspace = true

[dependencies]
fluent-bundle = "0.16"
fluent-syntax = "0.11"
intl-memoizer = "0.5"
rust_decimal = "1"
chrono = "0.4"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
rust_decimal_macros = "1"
# Story 15-14a (C-15-14-27) — gardes de texte G8, G10, G11. Déjà au Cargo.lock
# (version de kesh-db et kesh-import) : aucun paquet neuf.
regex = "1.10"
