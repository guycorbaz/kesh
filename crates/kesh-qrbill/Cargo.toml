[package]
name = "kesh-qrbill"
version = "0.11.0"
edition.workspace = true
license.workspace = true
description = "Swiss QR Bill SIX 2.2 payload builder and PDF generator"

[dependencies]
# Story 22-1 (D3, arbitrage Guy 2026-08-14) : le prédicat `is_invisible` est
# factorisé dans kesh-core — le crate cesse d'être « standalone », propriété
# théorique (jamais publié) sacrifiée à l'unicité de la définition.
kesh-core = { path = "../kesh-core" }
printpdf = "0.7"
qrcodegen = "1.8"
rust_decimal = { version = "1.41", features = ["maths"] }
chrono = "0.4"
thiserror = "2"
time = "0.3"

[dev-dependencies]
rxing = "0.7"
sha2 = "0.10"
rust_decimal_macros = "1.40"
