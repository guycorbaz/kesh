[package]
name = "kesh-core"
version = "0.17.0"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
kesh-import = { path = "../kesh-import" }
rust_decimal = { version = "1.41", features = ["serde-str", "maths"] }
rust_decimal_macros = "1.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
# Story 32-8b0 — catégorie générale Unicode du prédicat `text::is_hidden_format`.
# Aucune crate de plus au graphe : la même version y est déjà par `stringprep`.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
