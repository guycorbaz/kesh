[package]
name = "kesh-core"
version = "0.17.6"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
# Story 35-5a (#1022, #907, #929) — le jour civil de Zurich (`horloge::jour_suisse`). Base IANA
# précompilée, aucune lecture de `/usr/share/zoneinfo` ni de `TZ`. Déjà au graphe, même version,
# par `rxing` : aucun paquet ajouté.
chrono-tz = "0.10.4"
kesh-import = { path = "../kesh-import" }
rust_decimal = { version = "1.41", features = ["serde-str", "maths"] }
rust_decimal_macros = "1.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
# Story 32-8b0 — catégorie générale Unicode du prédicat `text::is_hidden_format`.
# Aucune crate de plus au graphe : la même version y est déjà par `stringprep`.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
