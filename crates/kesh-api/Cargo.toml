[package]
name = "kesh-api"
version = "0.13.0"
edition.workspace = true
license.workspace = true

[dependencies]
kesh-core = { path = "../kesh-core" }
kesh-db = { path = "../kesh-db" }
kesh-i18n = { path = "../kesh-i18n" }
kesh-import = { path = "../kesh-import" }
kesh-qrbill = { path = "../kesh-qrbill" }
kesh-reconciliation = { path = "../kesh-reconciliation" }
kesh-report = { path = "../kesh-report" }
kesh-seed = { path = "../kesh-seed" }

axum = { version = "0.8", features = ["multipart"] }
# Story 10-5 — extracteur CookieJar pour les cookies HttpOnly d'auth.
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
# Story 10-5 — `time::Duration` pour Cookie::max_age (cookie crate dépend de time, pas chrono).
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Story v011-1 — logs fichier avec rotation native (alternative à `docker logs`).
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Story 1.5 — authentification
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.41", features = ["serde-str"] }
thiserror = "2"
unicode-normalization = "0.1"

# Story 5.4 — export CSV échéancier (BOM + séparateur ; + CRLF, RFC 4180).
csv = "1"

# Story 8-1b — hash SHA-256 du fichier importé (dédup company-scope).
sha2 = "0.10"

# Story 12-5b (#194) — décodage QR côté serveur des factures importées.
# rxing : décodage QR (image → texte SPC). image : manipulation bitmap (rendu
# pdfium → DynamicImage → rxing). pdfium-render : rendu des pages PDF en image
# (binaire natif libpdfium.so, bundlé dans l'image Docker amd64, DC1-bis).
rxing = "0.7"
image = "0.25"
pdfium-render = "0.8"

# Story 9-2b — export global ZIP (souveraineté des données).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Story 17-3a — streaming du `.keshbackup` au-delà du plafond in-memory (DC8).
tokio-util = { version = "0.7", features = ["io"] }

# Story 17-4b — envoi d'email transactionnel SMTP (recovery, DC2). rustls
# (PAS native-tls) pour réutiliser la stack TLS de sqlx (runtime-tokio-rustls)
# sans dép OpenSSL système. default-features = false exclut native-tls.
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }

# Story 15-13a (#551) — lecture du mot de passe de `DATABASE_URL` pour
# l'avertissement « mot de passe publié / gabarit ». `url` rend le mot de passe
# encodé ; `percent-encoding` le décode (`url` ne le réexporte pas). Toutes deux
# déjà au Cargo.lock (dépendances transitives) : aucun paquet neuf.
url = "2"
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Story 15-14a (C-15-14-27) — gardes de texte de `tests/textes_coherents.rs`.
# Déjà au Cargo.lock (version de kesh-db et kesh-import) : aucun paquet neuf.
regex = "1.10"
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies"] }
rust_decimal_macros = "1.40"
# Story v011-1 — répertoire temporaire pour le test d'intégration logs fichier.
tempfile = "3"
# Story 15-5e1 (choix C70) — le volet (c) du registre des routes analyse le
# corps des handlers avec l'analyseur de Rust (déjà au Cargo.lock, 2.0.118).
syn = { version = "2", features = ["full", "visit"] }
# Story 15-11b (#550, C78) — le test `configuration_transmise` relève les
# jetons du code de production dans le flux `proc_macro2` (positions par la
# feature `span-locations`). Dépendance directe nécessaire pour nommer
# `TokenStream`/`TokenTree` ; déjà au Cargo.lock (1.0.106).
proc-macro2 = { version = "1", features = ["span-locations"] }
# Story 15-11b (C-15-11b-2) — `ToTokens` pour lire les attributs de tête de
# tout élément ou instruction (exclusion `cfg(test)`). Déjà au Cargo.lock
# (dépendance de `syn`) : aucun paquet neuf.
quote = "1"
# Story 15-11a (#550, choix C72) — analyseur YAML des compose pour le test
# `configuration_transmise` (pur Rust, sans serde). Dépendance de test seule.
yaml-rust2 = "0.13.0"
