[package]
name = "kesh-report"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[dependencies]
kesh-core = { path = "../kesh-core" }
kesh-db = { path = "../kesh-db" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "rust_decimal", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1.41", features = ["serde-str", "maths"] }
tracing = "0.1"
# Story 9-2a — Export PDF & CSV.
# `printpdf 0.7` cohérent kesh-qrbill (decision §pdf-lib, pas de churn workspace v0.1).
# `csv 1.3` RFC 4180 compliant pour export CSV (BOM + ; delimiter + CRLF terminator).
printpdf = "0.7"
csv = "1.3"

[dev-dependencies]
rust_decimal_macros = "1.40"
# Story 9-2a — benchmark des sérialiseurs PDF/CSV (AC #9, #30, #31).
criterion = "0.5"

[[bench]]
name = "export"
harness = false
