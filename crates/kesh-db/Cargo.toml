[package]
name = "kesh-db"
version = "0.9.0"
edition.workspace = true
license.workspace = true

[dependencies]
kesh-core = { path = "../kesh-core" }
kesh-import = { path = "../kesh-import" }
# Story 12.3 : génération pain.001 (kesh-payment) + validation IBAN/QR-IBAN/QRR
# (kesh-qrbill) côté repo `payment_batches`. Crates feuilles (aucune dépendance
# vers kesh-db) → pas de cycle.
kesh-payment = { path = "../kesh-payment" }
kesh-qrbill = { path = "../kesh-qrbill" }
regex = "1.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "migrate", "chrono", "macros", "rust_decimal", "json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1.41", features = ["serde-str", "maths"] }
tracing = "0.1"
# KF-002-H-002 (#43) : `tokio::time::sleep` pour le backoff entre retries
# de deadlock dans `retry::retry_on_deadlock`. La feature `time` est nécessaire
# car elle n'est pas systématiquement activée par les autres crates qui
# utilisent tokio (sqlx `runtime-tokio-rustls` n'active que ce dont elle a
# besoin pour son driver, pas `time`). `default-features = false` minimise
# le scope ajouté ; cargo unifie les features avec sqlx via la version
# semver `"1"` partagée entre tout le workspace.
tokio = { version = "1", default-features = false, features = ["time"] }
# Story 10-2 : parsing + comparaison SemVer pour le module `version.rs`
# (check_downgrade_protection). Feature `serde` non-activée — pas de
# serialisation cross-process des `Version`, uniquement parsing depuis
# VARCHAR DB et comparaison via `Ord`. Crate déjà résolu transitivement
# dans Cargo.lock (cargo-metadata), pas de re-résolution.
semver = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
rust_decimal_macros = "1.40"
# Story 9-1 : tests sqlx report_aggregates.rs (niveau repository, complémentaire reports_e2e HTTP)
kesh-report = { path = "../kesh-report" }
