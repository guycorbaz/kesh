# Mode dev : MariaDB + kesh-api (mode test intégration)
# Pour le développement quotidien avec hot reload : cargo run + MariaDB seule
# Pour la production : voir docker-compose.yml (Story 8.1)

services:
  kesh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kesh-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    environment:
      DATABASE_URL: mysql://kesh:kesh_dev@mariadb:3306/kesh
      KESH_PORT: "80"
      # Story 6.4 : le défaut applicatif est désormais 127.0.0.1. En Docker,
      # on bind 0.0.0.0 pour que le port mapping `127.0.0.1:80:80`
      # de la section `ports:` fonctionne (sinon le container écouterait
      # uniquement sur sa propre loopback, inaccessible depuis l'hôte).
      # Ne JAMAIS set KESH_TEST_MODE=true avec KESH_HOST=0.0.0.0
      # (ConfigError::TestModeWithPublicBind refusera le démarrage).
      KESH_HOST: "0.0.0.0"
      KESH_ADMIN_USERNAME: ${KESH_ADMIN_USERNAME:-admin}
      KESH_ADMIN_PASSWORD: ${KESH_ADMIN_PASSWORD:-admin}
      KESH_JWT_SECRET: ${KESH_JWT_SECRET:-dev-secret-at-least-32-bytes-long-for-testing}
      # Onboarding reset gate (Story 7-1, KF-002).
      # Set to "1" / "true" / "yes" to allow /onboarding/reset past step 2 in demo mode.
      # NEVER enable in production — see docs/MULTI-TENANT-SCOPING-PATTERNS.md.
      KESH_PRODUCTION_RESET: ${KESH_PRODUCTION_RESET:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Logs fichier (Story v011-1, Issue #119) — DÉSACTIVÉS par défaut en dev
      # (stdout/`docker logs` suffit). Pour les activer : set KESH_LOG_FILE_PATH
      # (ex. /var/log/kesh/kesh.log) + ajouter un mount `- ./log:/var/log/kesh`.
      KESH_LOG_FILE_PATH: ${KESH_LOG_FILE_PATH:-}
      KESH_LOG_FILE_ROTATION: ${KESH_LOG_FILE_ROTATION:-daily}
      KESH_LOG_FILE_MAX_FILES: ${KESH_LOG_FILE_MAX_FILES:-7}
      KESH_LOG_FILE_FORMAT: ${KESH_LOG_FILE_FORMAT:-pretty}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mariadb:
    image: mariadb:10.11
    container_name: kesh-mariadb-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: kesh_dev_root
      MARIADB_DATABASE: kesh
      MARIADB_USER: kesh
      MARIADB_PASSWORD: kesh_dev
    # Story 22-5 (#251) — LA BASE DE DEV EST JETABLE, ET MONTÉE EN RAM.
    #
    # ⚠️ Conséquence assumée : /var/lib/mysql ne survit PAS au restart du
    # conteneur. La base `kesh` repart vide, et son seed doit être rejoué —
    # procédure dans docs/testing.md § « Base de dev jetable ». L'oubli est
    # bruyant, pas silencieux : les 154 tests sur base partagée s'ouvrent sur
    # `expect("need at least one company in DB for tests")`.
    #
    # En contrepartie, les bases éphémères de `#[sqlx::test]` ne touchent plus
    # le disque, et les orphelines qu'un run interrompu laisse derrière lui
    # sont effacées par le restart au lieu de s'accumuler.
    #
    # `size=` est EXPLICITE : le défaut d'un tmpfs est la moitié de la RAM de
    # l'hôte, ce qui ferait de cette ligne une réserve de 15 Go sur la station
    # aux deux OOM documentés (cf. CLAUDE.md § « Plafonds mémoire »). 4 Go
    # couvrent largement la base de dev, les bases de gate et les éphémères
    # d'un run complet ; au-delà, MariaDB échoue bruyamment sur disque plein
    # plutôt que la station en pression mémoire.
    tmpfs:
      - /var/lib/mysql:size=4g,mode=1777
    # Corollaire du tmpfs : les tables système repartent vierges à chaque
    # démarrage, donc les droits globaux dont `#[sqlx::test]` a besoin pour
    # créer ses bases éphémères disparaissent avec elles. L'entrypoint MariaDB
    # rejoue ce répertoire dès que le datadir est vide — ici, à tous les coups.
    volumes:
      - ./scripts/mariadb-init:/docker-entrypoint-initdb.d:ro
    # Durabilité relâchée : la donnée ne survit pas au restart de toute façon,
    # payer les fsync de chaque commit n'achète plus rien.
    command:
      - --innodb_flush_log_at_trx_commit=0
      - --sync_binlog=0
      - --innodb-doublewrite=0
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
