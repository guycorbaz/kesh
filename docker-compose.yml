services:
  # --- Base de données MariaDB ---
  mariadb:
    image: mariadb:10.11
    container_name: kesh-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-kesh_dev_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-kesh}
      MARIADB_USER: ${MARIADB_USER:-kesh}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-kesh_dev}
    ports:
      - "3306:3306"
    volumes:
      - kesh-mariadb-data:/var/lib/mysql
    networks:
      - kesh-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # --- API Kesh (Rust + Frontend statique) ---
  kesh-api:
    # Image publiée : `docker compose up -d` la TIRE (ce fichier s'installe seul,
    # sans les sources). Depuis un clone du dépôt, `docker compose up -d --build`
    # construit depuis les sources — et ÉTIQUETTE ce build `gcorbaz/kesh:latest`,
    # que les `up -d` suivants emploient sans tirer ; pour revenir à l'image
    # publiée : `docker compose pull kesh-api`.
    image: gcorbaz/kesh:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kesh-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # ⚠️ Seules les variables listées ici atteignent Kesh : Compose lit `.env`
      # pour remplir les `${…}` de ce fichier, sans le transmettre au conteneur.
      # Une variable ajoutée au code doit l'être ici — test `configuration_transmise`.
      # Après une modification de `.env` : `docker compose up -d` (un `restart`
      # ne relit pas `.env`).
      #
      # Base de données — correspond au service mariadb ci-dessus
      DATABASE_URL: mysql://${MARIADB_USER:-kesh}:${MARIADB_PASSWORD:-kesh_dev}@mariadb:3306/${MARIADB_DATABASE:-kesh}

      # Application
      KESH_PORT: ${KESH_PORT:-80}
      KESH_HOST: ${KESH_HOST:-0.0.0.0}  # 0.0.0.0 en docker-compose (reverse proxy fronts)

      # Admin initial — optionnel : vide → onboarding `/setup` au premier accès.
      # Si posé : ≥ 12 caractères, ni `changeme`, ni placeholder du gabarit.
      KESH_ADMIN_USERNAME: ${KESH_ADMIN_USERNAME:-admin}
      KESH_ADMIN_PASSWORD: ${KESH_ADMIN_PASSWORD:-}

      # Authentification
      KESH_JWT_SECRET: ${KESH_JWT_SECRET:-change-me-32-bytes-minimum-secret-generate-with-openssl-rand-hex-32}
      KESH_JWT_EXPIRY_MINUTES: ${KESH_JWT_EXPIRY_MINUTES:-15}
      KESH_REFRESH_TOKEN_MAX_LIFETIME_DAYS: ${KESH_REFRESH_TOKEN_MAX_LIFETIME_DAYS:-30}
      # Flag Secure des cookies de session. true (défaut) = sécurisé, EXIGE HTTPS.
      # ⚠️ Accès en HTTP simple (LAN/NAS sans reverse proxy TLS) : le navigateur
      # refuse un cookie Secure → login impossible. Mettre KESH_COOKIE_SECURE=false
      # dans .env pour ce cas (ou, mieux, servir en HTTPS via reverse proxy).
      KESH_COOKIE_SECURE: ${KESH_COOKIE_SECURE:-true}

      # Session & Rate Limiting
      KESH_REFRESH_INACTIVITY_MINUTES: ${KESH_REFRESH_INACTIVITY_MINUTES:-15}
      KESH_RATE_LIMIT_WINDOW_MINUTES: ${KESH_RATE_LIMIT_WINDOW_MINUTES:-15}
      KESH_RATE_LIMIT_MAX_ATTEMPTS: ${KESH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      KESH_RATE_LIMIT_BLOCK_MINUTES: ${KESH_RATE_LIMIT_BLOCK_MINUTES:-30}

      # Logging — stdout (docker logs) + fichier avec rotation (Story v011-1).
      RUST_LOG: ${RUST_LOG:-info}
      # Écrit AUSSI les logs dans un fichier /var/log/kesh/kesh.log (bind-monté
      # sur l'hôte, cf. volumes) avec rotation. Opt-out : une ligne
      # `KESH_LOG_FILE_PATH=` VIDE dans .env → stdout uniquement. Tiret SANS
      # deux-points : le défaut ne vaut que pour une variable absente de .env.
      KESH_LOG_FILE_PATH: ${KESH_LOG_FILE_PATH-/var/log/kesh/kesh.log}
      KESH_LOG_FILE_ROTATION: ${KESH_LOG_FILE_ROTATION:-daily}
      KESH_LOG_FILE_MAX_FILES: ${KESH_LOG_FILE_MAX_FILES:-7}
      KESH_LOG_FILE_FORMAT: ${KESH_LOG_FILE_FORMAT:-pretty}

      # Import de factures depuis un dossier (Story 12-5, #194)
      KESH_DOCUMENTS_DIR: ${KESH_DOCUMENTS_DIR:-/data/documents}
      KESH_INBOX_DIR: ${KESH_INBOX_DIR:-/data/inbox}
      KESH_INBOX_MAX_FILE_BYTES: ${KESH_INBOX_MAX_FILE_BYTES:-26214400}
      KESH_INBOX_MAX_FILES_PER_RUN: ${KESH_INBOX_MAX_FILES_PER_RUN:-200}
      KESH_INBOX_MAX_PDF_PAGES: ${KESH_INBOX_MAX_PDF_PAGES:-20}

      # Les variables ci-dessous, en `${NOM:-}`, gardent le défaut du code quand
      # `.env` ne les pose pas (manuel d'administration, § Variables d'environnement).

      # Localisation, politique de mot de passe, import bancaire
      KESH_LANG: ${KESH_LANG:-}
      KESH_PASSWORD_MIN_LENGTH: ${KESH_PASSWORD_MIN_LENGTH:-}
      KESH_BANK_IMPORT_MAX_MB: ${KESH_BANK_IMPORT_MAX_MB:-}

      # E-mails sortants (envoi de factures) et mot de passe oublié par e-mail
      KESH_SMTP_HOST: ${KESH_SMTP_HOST:-}
      KESH_SMTP_PORT: ${KESH_SMTP_PORT:-}
      KESH_SMTP_USER: ${KESH_SMTP_USER:-}
      KESH_SMTP_PASSWORD: ${KESH_SMTP_PASSWORD:-}
      KESH_SMTP_FROM: ${KESH_SMTP_FROM:-}
      KESH_SMTP_TLS: ${KESH_SMTP_TLS:-}
      KESH_PUBLIC_BASE_URL: ${KESH_PUBLIC_BASE_URL:-}
      KESH_FEATURE_FORGOT_PASSWORD: ${KESH_FEATURE_FORGOT_PASSWORD:-}

      # Sortie de la démonstration (réinitialisation d'une installation de démo)
      KESH_PRODUCTION_RESET: ${KESH_PRODUCTION_RESET:-}

      # Export / import d'installation (.keshbackup)
      KESH_ADMIN_BACKUP_DIR: ${KESH_ADMIN_BACKUP_DIR:-}
      KESH_ADMIN_EXPORT_INMEM_MB: ${KESH_ADMIN_EXPORT_INMEM_MB:-}
      KESH_ADMIN_IMPORT_MAX_MB: ${KESH_ADMIN_IMPORT_MAX_MB:-}
    ports:
      - "80:80"
    volumes:
      # Logs fichier (Story v011-1) — répertoire host accessible (par défaut ./log).
      # Sur NAS, pointe KESH_LOG_HOST_DIR vers un dossier partagé pour consulter
      # les logs depuis le PC (ex. /volume1/kesh/log).
      - ${KESH_LOG_HOST_DIR:-./log}:/var/log/kesh
      # Import de factures (Story 12-5) — dossiers montés en BIND MOUNTS host pour
      # être ACCESSIBLES DEPUIS TON PC (SMB direct ou Synology Drive).
      #
      # Synology : crée un dossier partagé DSM (ex. « kesh ») avec les sous-dossiers
      # `inbox` et `documents`, puis renseigne dans .env les chemins ABSOLUS :
      #     KESH_INBOX_HOST_DIR=/volume1/kesh/inbox
      #     KESH_DOCUMENTS_HOST_DIR=/volume1/kesh/documents
      # Enfin, active SMB (Panneau config → Services de fichiers) OU Synology Drive
      # sur le dossier partagé → mappe/synchronise `inbox` sur le PC et dépose tes
      # factures dedans. Kesh les lit dans /data/inbox (= le dossier bind-monté).
      # Défauts (dev, sans .env) : sous-dossiers ./inbox et ./documents du projet.
      - ${KESH_INBOX_HOST_DIR:-./inbox}:/data/inbox
      - ${KESH_DOCUMENTS_HOST_DIR:-./documents}:/data/documents
    networks:
      - kesh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kesh-mariadb-data:
    driver: local
  # Story 12-5 (#194) : inbox + documents sont désormais des BIND MOUNTS host
  # (cf. service kesh-api) pour être accessibles depuis le PC — plus de volumes
  # nommés (un volume nommé vit dans le stockage interne Docker, non exposable
  # via File Station / Synology Drive).

networks:
  kesh-network:
    driver: bridge
