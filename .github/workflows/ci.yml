name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    # Historique : la suite `cargo test --workspace -j1 --test-threads=1` a
    # dépassé 30 min à partir de l'Epic 21 (le job était annulé à ~30m17s), d'où
    # cette marge portée à 120 min.
    #
    # Depuis la Story 22-5 (#251), le levier est LIVRÉ : 1102 des 1145 attributs
    # `#[sqlx::test]` montent le squash `crates/kesh-db/test-schema/` au lieu de
    # rejouer les 61 migrations. Mesuré le 2026-08-16 en local (2209 tests) :
    # 64,4 min → 19,8 min, et 1,5 min en ajoutant le tmpfs de dev (hors CI, où
    # `services:` ne permet pas de passer de `command:` à mariadbd).
    #
    # Première mesure sur runner GitHub après la bascule (PR #311, 2026-08-16) :
    # le job « Backend (Rust) » complet — build + clippy + `cargo test` en série
    # — a pris **19 min 14 s**, là où il dépassait 30 min et se faisait annuler
    # à 30 min 17 avant le squash.
    #
    # ⚠️ LA MARGE RESTE À 120 MIN, ET C'EST DÉLIBÉRÉ. Un timeout se dimensionne
    # sur le pire cas, pas sur le cas mesuré : un seul run ne dit rien de la
    # dispersion, les runners GitHub sont partagés, et un timeout trop juste
    # transforme un ralentissement passager en échec de CI — c'est-à-dire en
    # rouge qu'on apprend à ignorer. La baisser demande plusieurs runs, pas
    # celui-ci.
    timeout-minutes: 120
    services:
      mariadb:
        # Story 10-1 D3 : pin 10.11 = parité prod NAS Synology Package Center DSM.
        # Compat MariaDB ≥ 10.6 (cf. migration reconciliation_rules.sql VIRTUAL+UNIQUE).
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: kesh_root
          MARIADB_DATABASE: kesh
          MARIADB_USER: kesh
          MARIADB_PASSWORD: kesh_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:kesh_root@127.0.0.1:3306/kesh
      # Story 9-1 (Pass 2 ECH2-07) avait ajouté `SQLX_MAX_CONNECTIONS: "4"` ici, mais
      # code-review Pass 1 Sonnet a établi que la var n'est lue NULLE PART (main.rs:43
      # hardcode `max_connections(5)`, sqlx::test utilise sa propre config). Retirée :
      # `cargo test --workspace -j1 -- --test-threads=1` serialise déjà entièrement
      # l'exécution (1 binaire à la fois, 1 thread par binaire) donc le pool default
      # de 5 connexions est largement suffisant. Si une vraie contention apparaît,
      # ajouter `pool_max_conns=N` au query string DATABASE_URL (lu par sqlx).
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      # `.cargo/config.toml` configure mold comme linker
      # (rustflags `-fuse-ld=mold`) pour tout le workspace. mold doit donc être
      # présent sur le runner, sinon `cargo build`/`clippy`/`test` échouent avec
      # « cannot find mold ». gcc d'ubuntu-latest (≥ 13) supporte `-fuse-ld=mold`.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@v2

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pkesh_root --silent; then
              echo "MariaDB ready"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB not ready"; exit 1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Story 8-1a (AC #7) : kesh-import est publiable indépendamment sur
      # crates.io. cargo publish --dry-run vérifie que le manifeste, les
      # exclusions et les dépendances respectent les contraintes du registry.
      # Pas de --allow-dirty : le checkout CI est propre et un build script
      # qui mute le tree doit échouer ici (review code Pass 1 finding F3).
      - name: kesh-import — cargo publish --dry-run
        run: cargo publish --dry-run -p kesh-import

      # Story 8-1a (AC #6) : invariant zéro dépendance workspace interne.
      # Le crate doit rester autonome (décision archi #7) pour pouvoir
      # publier sur crates.io sans pulled-in `kesh-core`/`kesh-db`/etc.
      # `cargo metadata --no-deps` filtré sur les deps `path != null` doit
      # être vide. Hardening review code Pass 1 :
      # - F4 : `--no-deps` évite de charger tout le graph transitif et
      #   empêche un faux positif si un crate externe partageait le nom
      #   `kesh-import`.
      # - F5 : `set -euo pipefail` + check explicite de `jq` pour que
      #   l'échec de `cargo metadata` ou l'absence de `jq` ne se traduise
      #   pas en INTERNAL_DEPS vide (faux pass).
      - name: kesh-import — invariant zéro path dep interne
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq requis pour cet invariant" >&2; exit 2; }
          INTERNAL_DEPS=$(cargo metadata --no-deps --format-version 1 -q \
            | jq -r '.packages[] | select(.name == "kesh-import") | .dependencies[] | select(.path != null) | .name')
          if [ -n "$INTERNAL_DEPS" ]; then
            echo "::error::kesh-import a des dépendances workspace internes :"
            echo "$INTERNAL_DEPS"
            exit 1
          fi

      # 154 tests de la lib `kesh-db` (pré-Story-6-4) se connectent directement à
      # DATABASE_URL au lieu d'utiliser `#[sqlx::test]` : 151 via le helper
      # `test_pool()` (24 accounts + 3 audit_log + 33 contacts + 37 invoices +
      # 34 journal_entries + 20 products) et 3 qui ouvrent leur propre connexion
      # (2 dans `invoices.rs`, 1 dans `retry.rs`).
      #
      # ⚠️ Le critère est le MODE DE CONNEXION, pas le chemin de module : dire
      # « les tests `kesh-db::repositories::*` » serait faux, puisque
      # `repositories::bank_profiles::tests` utilise bel et bien `#[sqlx::test]`
      # et n'a donc besoin de rien de tout ceci. *(Relevé en passe 1 de revue.)*
      # Ils exigent donc que la DB `kesh` ait ses migrations appliquées + 1
      # company + 1 admin user seedés. Les tests d'intégration plus récents
      # (*_e2e.rs) utilisent `#[sqlx::test]` → DB éphémère auto-setup, pas
      # impactés par cette step. Remédiation pérenne (hors scope Story 6-4) :
      # refactorer les 154 tests pour `#[sqlx::test(migrations = "./test-schema")]`
      # (graphie du squash depuis kesh-db — cf. Story 22-5 / issue #251).
      - name: Install mariadb-client
        run: sudo apt-get install -y mariadb-client

      - name: Apply migrations to kesh DB
        run: |
          for migration in crates/kesh-db/migrations/*.sql; do
            echo ">>> Applying $(basename "$migration")"
            mariadb -h 127.0.0.1 -u root -pkesh_root kesh < "$migration"
          done

      - name: Seed CI fixtures (company + admin + fiscal_year + accounts)
        # ⚠️ Le SQL vit dans `scripts/seed-dev-db.sql` et n'est PAS recopié ici.
        # Les deux copies ont coexisté le temps d'une story, sans rien qui
        # rougisse si l'une dérivait — dans un dépôt dont la même story ajoute un
        # garde-fou contre exactement ce mode d'échec côté schéma.
        # *(Duplication relevée par deux lentilles en passe 1 de revue de code.)*
        #
        # Le fichier documente son propre contenu et les invariants qu'il tient.
        run: mariadb -h 127.0.0.1 -u root -pkesh_root kesh < scripts/seed-dev-db.sql

      - name: cargo test
        # --test-threads=1 : tests share global state (i18n, error locale) and
        # require serial execution within each binary.
        # -j1 : serialize test binaries to avoid SQLx PoolTimedOut across binaries.
        run: cargo test --workspace -j1 -- --test-threads=1

      - name: Job summary
        if: always()
        run: |
          echo "### Job \`${{ github.job }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Started: $(date -u)" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Lint i18n key-ownership
        run: npm run lint-i18n-ownership

      - name: unit tests
        run: npm run test:unit

      - name: build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 1

      - name: Job summary
        if: always()
        run: |
          echo "### Job \`${{ github.job }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Started: $(date -u)" >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: Docker build (sanity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: kesh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: always()
        run: |
          echo "### Job \`${{ github.job }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Started: $(date -u)" >> $GITHUB_STEP_SUMMARY
