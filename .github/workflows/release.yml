name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  docker:
    name: Build, smoke-test & push Docker image
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: kesh_root
          MARIADB_DATABASE: kesh
          MARIADB_USER: kesh
          MARIADB_PASSWORD: kesh_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (load to local daemon, no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            gcorbaz/kesh:${{ steps.version.outputs.version }}
            gcorbaz/kesh:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/guycorbaz/kesh
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Wait for MariaDB
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pkesh_root --silent; then
              echo "MariaDB ready"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB not ready after 60s"; exit 1

      - name: Smoke test — run image and assert /health
        id: smoke
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="gcorbaz/kesh:${VERSION}"

          # Secrets bidon générés à la volée, suffisants pour passer la validation
          # de config (jwt ≥ 32 bytes, admin password ≥ 12 chars). Container jeté
          # à la fin du job, jamais publié.
          JWT_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="$(openssl rand -base64 18)"

          echo "→ Starting container from $IMAGE"
          docker run -d \
            --name kesh-smoke \
            --network=host \
            -e DATABASE_URL="mysql://root:kesh_root@127.0.0.1:3306/kesh" \
            -e KESH_HOST="0.0.0.0" \
            -e KESH_PORT="80" \
            -e KESH_JWT_SECRET="$JWT_SECRET" \
            -e KESH_ADMIN_USERNAME="admin" \
            -e KESH_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e RUST_LOG="info" \
            "$IMAGE"

          echo "→ Waiting for /health to return 200 (timeout 60s)"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1/health > /tmp/health.json 2>/dev/null; then
              echo "→ /health OK at attempt $i"
              cat /tmp/health.json
              echo
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "✗ /health never returned 200"
              echo "--- container logs ---"
              docker logs kesh-smoke || true
              exit 1
            fi
            sleep 2
          done

          echo "→ Asserting body shape"
          STATUS=$(jq -r '.status' /tmp/health.json)
          DB=$(jq -r '.db' /tmp/health.json)
          REPORTED_VERSION=$(jq -r '.version' /tmp/health.json)
          # Le binaire renvoie `env!("CARGO_PKG_VERSION")` (= Cargo.toml). Pour un
          # tag pré-release `vX.Y.Z-rcN`, Cargo.toml reste figé à `X.Y.Z` (convention
          # SemVer). On compare donc la base du tag (suffixe strip) à la version
          # reportée. Pour un tag final `vX.Y.Z` les deux valent X.Y.Z, assertion
          # équivalente.
          BASE_VERSION="${VERSION%%-*}"
          FAIL=0
          [ "$STATUS" = "ok" ]           || { echo "✗ status=$STATUS, want ok"; FAIL=1; }
          [ "$DB" = "true" ]             || { echo "✗ db=$DB, want true"; FAIL=1; }
          [ "$REPORTED_VERSION" = "$BASE_VERSION" ] \
            || { echo "✗ version=$REPORTED_VERSION, want $BASE_VERSION (base of tag $VERSION)"; FAIL=1; }
          if [ $FAIL -ne 0 ]; then
            echo "--- container logs ---"
            docker logs kesh-smoke || true
            exit 1
          fi
          echo "✓ smoke test passed: status=ok, db=true, version=$REPORTED_VERSION (tag $VERSION)"

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f kesh-smoke 2>/dev/null || true

      - name: Push image to Docker Hub
        run: |
          docker push gcorbaz/kesh:${{ steps.version.outputs.version }}
          docker push gcorbaz/kesh:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
