# Configuration cargo-nextest — gate rapide (Story 21-2b, 2026-07-13 ;
# compteurs et mesures rafraîchis par la Story 22-5, 2026-08-16).
#
# CONTEXTE / MESURES HISTORIQUES du 2026-07-13, soit AVANT le squash de schéma
# (machine 32 cœurs, MariaDB dev local `max_connections=100`, durabilité par
# défaut) — suite backend d'alors, 1802 tests. Les mesures COURANTES sont plus
# bas, sous « MESURES 2026-08-16 » :
#
#   série      (--test-threads=1)  : 53:57  (3237 s)  1802/0
#   6 threads  (ce défaut)         : 38:25  (2305 s)  1802/0, 0 flake   → 1,40× plus rapide
#   32 threads (défaut nextest)    : CASSÉ  — contention MariaDB → 3 flakes
#                                     reconciliation_*_e2e (KF-038 #228) + tests « slow »
#
# Le goulot n'était PAS le CPU mais MariaDB : chaque test `#[sqlx::test]`
# rejouait les migrations une par une (DDL sérialisé par les metadata-locks),
# et c'est cette contention qui a figé le plafond à 6 threads.
#
# CE N'EST PLUS LE CAS DEPUIS LA STORY 22-5 (issue #251) : 1102 des 1145
# attributs `#[sqlx::test]` montent le squash `crates/kesh-db/test-schema/`
# — un batch DDL unique au lieu des 61 migrations. Les 43 restants gardent le
# vrai `MIGRATOR` parce qu'ils testent CE chemin (installation fraîche,
# fenêtres d'upgrade, backfills, garde-fou de schéma) ; la liste est tenue en
# dur par `crates/kesh-db/tests/test_schema_guard.rs`, qui rougit sur tout
# écart.
#
# MESURES 2026-08-16 (même machine, profil ci, 2209 tests, deux runs par état,
# compilation hors chronomètre) :
#
#   avant le squash (61 migrations/test) : 3677 s / 4051 s  → moyenne 64,4 min
#   après le squash (1 batch DDL/test)   : 1266 s / 1111 s  → moyenne 19,8 min
#                                                             = 3,25× plus rapide
#   + tmpfs de dev (Story 22-5, T6)      :   91 s /   89 s  → moyenne  1,5 min
#                                                             = 13,2× DE PLUS,
#                                                               soit 42,8× au total
#
# Le tmpfs pèse donc plus lourd que le squash — la création d'une base éphémère
# était dominée par les fsync, et le squash réduisait le NOMBRE d'opérations DDL
# sans toucher à leur coût unitaire. ⚠️ Cette troisième ligne ne vaut QUE pour le
# poste de dev : la CI n'a pas de tmpfs (`services:` GitHub Actions ne permet pas
# de passer de `command:` à mariadbd).
#
# ⚠️ Le tableau HISTORIQUE plus haut et la première ligne ci-dessus ne se
# contredisent pas, malgré 38 min contre 64 min à configuration égale : entre les
# deux mesures, la suite a gagné 22,6 % de tests (1802 → 2209) et chaque test
# 19,6 % de migrations (51 → 61). Le produit (×1,47) explique l'essentiel de
# l'écart, le reste tenant au profil `ci` et à des tests plus lourds. Sans cette
# réconciliation, le dénominateur du « 3,25× » resterait discutable.
# *(Relevé en passe 1 de revue de code.)*
#
# LE PLAFOND EST PASSÉ DE 6 À 8 — décision de Guy, 2026-08-16, et cette fois
# MESURÉE. Sa justification d'origine (la contention des metadata-locks sur le
# rejeu des migrations) a disparu avec le squash, et la mesure est devenue
# assez bon marché pour être faite : trois runs de la suite complète, chacun
# précédé d'une remise à zéro de la base (cf. KF-039 #310), coûtent dix minutes
# là où la même vérification en demandait trois heures et demie avant la story.
#
#   6 threads : 91,1 s / 89,4 s                → moyenne 90,2 s
#   8 threads : 76,8 s / 83,6 s / 81,2 s       → moyenne 80,5 s   (≈ 12 % de gain)
#
# 2210/2210 aux cinq runs, et ZÉRO flake sur les trois runs à 8 threads.
#
# ⚠️ CE QUE CES TROIS RUNS N'ÉTABLISSENT PAS. Zéro flake sur trois runs ne
# prouve pas l'absence de flake : à 6 threads, KF-038 (#228) s'était manifestée
# sur UN run des trois observés. Trois runs propres à 8 sont donc parfaitement
# compatibles avec un défaut de même fréquence resté silencieux — l'échantillon
# est du même ordre que le phénomène qu'il devrait détecter. Ce qui est établi,
# c'est le GAIN (≈ 12 %) ; ce qui ne l'est pas, c'est l'innocuité.
#
# Conduite à tenir si un `reconciliation_*_e2e` rougit : commencer par ici, et
# considérer 8 comme la première hypothèse — pas comme un acquis.
#
# Le contexte KF-038 (#228) qui rend cette prudence nécessaire : cette famille
# de flakes, documentée plus haut comme apparaissant À 32 THREADS, est redevenue
# atteignable À 6 sous tmpfs. Mesuré le 2026-08-16 : 1 run sur 3, deux tests
# (`reconciliation_e2e::post_accept_skips_non_chf_transaction` et
# `post_reject_after_accept_returns_already_reconciled_failed`), échec à ~5,36 s
# puis vert au retry en 0,44 s. Le profil `ci` la masque (`retries = 1`) ; le
# profil par défaut, non. Le régime rapide a densifié la contention sur les
# verrous en supprimant l'attente disque.
#
# Ce fichier remplace le `cargo test --workspace -j1 -- --test-threads=1` de la
# CI (tout en série) par : plafond à 8 threads + tests lib kesh-db (DB dev
# partagée) sérialisés. Voir CLAUDE.md §Test Locally First et scripts/test-fast.sh.

[profile.default]
# Plafond mesuré APRÈS le squash (cf. le tableau de l'en-tête, 2026-08-16) :
# ≈ 12 % de gain sur 6, zéro flake sur trois runs — étant entendu que trois
# runs ne prouvent pas l'absence d'un flake qui s'était montré une fois sur
# trois. Surchargeable ponctuellement via `cargo nextest run --test-threads=N`.
test-threads = 8

[test-groups]
# Un seul test à la fois dans ce groupe : ces tests partagent la DB dev `kesh`
# (via `test_pool()`) et interfèrent sinon (cf. mémoire projet journal_entries).
shared-db-serial = { max-threads = 1 }

[[profile.default.overrides]]
# Tests unitaires de la lib kesh-db = les seuls sur la DB partagée.
filter = 'package(kesh-db) and kind(lib)'
test-group = 'shared-db-serial'

# Profil CI : mêmes règles + un retry sur les flakes de contention connus (KF-038
# #228), fail-fast désactivé pour un rapport complet.
[profile.ci]
test-threads = 8
retries = 1
fail-fast = false

[[profile.ci.overrides]]
filter = 'package(kesh-db) and kind(lib)'
test-group = 'shared-db-serial'
