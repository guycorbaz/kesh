`INSERT IGNORE` ; aucune des 3 n'a vu la protection de couverture avant BlindHunter. **PÉRIMÈTRE : registre 5 → 2, extraits 4 → 1, exemptions 2 → 7, cas de test 8 → 7, mutations 4 → 5, garde-fous 5 → 6, AC 10 → 11.** **RÈGLE DE SPLITTING** : 2e critère formellement coché (CRITICAL → CRITICAL) mais NON retenu — changement de modèle (Sonnet → Opus, précédent 16-1a-bis) et surtout la story RÉTRÉCIT à chaque passe, inverse du symptôme visé. À rouvrir si la P3 ne redescend pas. Prochaine = PASSE 3 (LLM ≠ Opus, contexte frais). # 2026-08-01 PASSE 1 `bmad-create-story validate` (Sonnet ×3 lentilles, contexte frais) — **8 findings : 2 CRITICAL, 2 HIGH, 2 MEDIUM, 2 LOW**, TOUS vérifiés ground-truth par l'orchestrateur, 0 faux positif. **LES 2 CRITICAL PORTENT SUR LA MÊME DÉCISION ET L'ONT FAIT REFONDRE.** D-C1 conditionnait tout rejeu à l'absence d'une colonne sentinelle ; le critère est faux DANS LES DEUX DIRECTIONS. **BH-1** : une 5e migration exposée avait échappé au triage — `20260614000001_vat_accounts_config` insère les comptes de TVA 1171/2206 manquants — MANQUÉE PARCE QUE MON GREP DE VÉRIFICATION ÉTAIT MONO-LIGNE (`INSERT INTO.*SELECT`, or le SELECT est à la ligne suivante) ; et la sentinelle-colonne ne s'y généralise pas, ce sont des LIGNES qui manquent. **ECH-1** : la sentinelle suppose « colonne présente ⇒ backfill appliqué », vrai SEULEMENT si DDL et backfill sont dans le MÊME fichier — or `20260727000001` crée `revenue_account_id` et `20260729000001` la remplit, donc un backup pris entre les deux porte la colonne 100 % NULL et aurait été déclaré « à jour », rouvrant le bug par un 2e chemin. **REFONTE EN 2 CLASSES** : classe A (tous statements gardés contre l'intention utilisateur) → rejeu INCONDITIONNEL, no-op strict, couvre les 2 cas ; classe B (contient un statement non gardé) → sentinelle, dont la validité est désormais VERROUILLÉE PAR UN TEST exigeant le `ADD COLUMN` dans la même migration. **UN DÉFAUT QU'AUCUNE LENTILLE N'A VU, TROUVÉ AU RECOMPTE DE L'ORCHE