amp n'est pas le lieu de la terminologie comptable — qui a sa place au manuel. Concerne 4 libellés, portés par les rollouts 23-3 et 23-5. **Partie B : 16 → 15 entrées, donc 12 après la promotion des 3 termes par la 23-1b** (AC11-quater et le paragraphe du glossaire recomptés). # 2026-08-19 (nuit) **PASSE 2 SUR LE SPLIT — Haiku x6.** 23-1a : 0C/2H/4M/3L ; 23-1b : 0C/2H/6M/2L. **Tous les chiffres du recompte des relais CONFIRMES au sol** par plusieurs lentilles (7 relais, 1151 litteraux, 279 manquantes, 14 dossiers, 346). **Les 4 HIGH sont UN SEUL diagnostic** : mes corrections des passes precedentes ont enrichi les DECISIONS et les TACHES, jamais les CRITERES — bornes revisees seulement dans le tableau de D5 (AC9 disait encore 3, T2 encore 900), clauses de D6 non exigees par AC10, D8-bis se declarant « constat » tout en imposant une relecture a T5, trois sous-taches de T5 sans critere. D'ou AC11-ter/quater/quinquies et deux clauses ajoutees a AC10. **TROIS findings Haiku REFUTES au sol, tenant a DEUX lectures** : `imported-supplier-invoices-error-unknown` est un litteral statique DEJA compte dans les 279 (le « +10 » designe les valeurs de la carte) — donc 346 tient, 347 serait un double compte ; et le « 0 » de D1 porte sur les cles presentes SEULEMENT en de-CH (mesure 0), pas sur les 57 de l'autre sens. # 2026-08-19 (nuit) **PASSE 3 `validate` — 0 CRITICAL, 2 HIGH, 10 MEDIUM, 6 LOW** (Opus x3, contextes frais). **Les DEUX HIGH ont convergé sur les trois lentilles** : (1) **sept** clés à repli divergent et non six — `payment-batches-col-date` manquait, TROISIEME recidive de la meme cause (ses deux replis sont entre guillemets DOUBLES car ils contiennent une apostrophe, qu'une classe negative ne traverse pas) ; la verification que j'ai ecrite pour la controler reproduisait elle-meme le defaut et rendait 6 ; (2) `bank-import-info-*` est un SECOND angle mort, pire que `vat-category-*` : ses valeurs sont poussees par le BACKEND Rust (`bank_imports.rs:693`/`:1668`), le frontend n'ayant qu'un `string[]` — aucune carte a confronter, donc l'assertion de cardinalite promise par D4 est verte a jamais. **MEDIUM notables** : le test supprime portait DEUX controles, celui des orphelines disparaissait alors qu'AC12 promettait sa conservation (AC12-ter) ; la partie B du glossaire compte **16** entrees et non 15, `personne de contact` y ayant ete ajoute par le commit de creation de cette spec — l'instruction « a ajouter » aurait fait un doublon ; `it-CH` compte **11 messages** au registre de courtoisie et non 1, chiffre que la passe 1 avait refute dans la prose du glossaire SANS toucher la ligne de tableau six lignes plus haut. ⛔ **TREND `CRITICAL -> HIGH -> HIGH` : le plafond de severite STAGNE**, ce que la § *Regle de splitting preventif* traite comme non-convergence (`N+1 >= N`) ; le volume >LOW ne decroit pas non plus (11 -> 10 -> 12). **ARBITRAGE DE GUY, 2026-08-19 : SPLIT** en 23-1a (mécanisme) + 23-1b (pilote), sur le patron 22-2a/22-2b. Motif : ce n'est pas le nombre de modules (quatre, sous le seuil), c'est que les findings forment DEUX familles qui ne se relisent pas avec la même lentille — le mécanisme (extracteur, motifs, ensembles ouverts, allowlists, orphelines) et les comptes rendus (glossaire, attestations, décomptes). En passe 3, presque tous les MEDIUM de la seconde famille étaient des RÉSIDUS des patches des passes 1 et 2. Corps de cette fiche VIDÉ (statut `split`, précédent 17-2). Identifiants de décisions et de critères INCHANGÉS dans les deux moitiés — les renuméroter casserait les renvois que trois passes ont vérifiés.  # 2026-08-19 (nuit) **PASSE 1 DE `validate` SUR LES DEUX MOITIÉS — 6 lentilles Sonnet, contextes frais.** 23-1a : 2 HIGH, 2 MEDIUM, 4 LOW ; 23-1b : 2 HIGH, 4 MEDIUM, 2 LOW. ⚠️ **UN FINDING CHANGE TOUS LES CHIFFRES DE L'EPIC** : sept fichiers déclarent un RELAIS `function msg(key, fallback) { return i18nMsg(key, fallback) }`, dont le littéral se trouve au site `msg(` et NON au site `i18nMsg(`. Toute extract