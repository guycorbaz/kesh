  epic-15: in-progress  # 2026-08-24 **KICKOFF** — plan : `_bmad-output/planning-artifacts/epic-15-lettrage-justificatifs.md`. **Arbitrage de Guy : « le lettrage est indispensable a la mise en production »** — d'ou un **ORDRE INVERSE** par rapport a `epics.md` : le lettrage passe AVANT les justificatifs. ⚠️ **L'inversion est possible parce que les deux stories sont INDEPENDANTES, verifie au sol** — le lettrage touche `journal_entry_lines`, les justificatifs un volume de fichiers ; aucune ne bloque l'autre. (Precedent E16 : l'inversion y etait imposee par une dependance de schema ; ici elle sert la seule priorite de mise en production.) ⚠️ **TROIS rapprochements EXISTENT DEJA et aucun ne fait le travail du lettrage** : `invoices.journal_entry_id` (facture <-> ecriture de vente), `bank_transactions.matched_entry_id` (Epic 8, transaction <-> ecriture), `invoices.paid_at` (marqueur). Ce qui manque est le rapprochement **LIGNE A LIGNE**, seul capable de dire ce qui reste OUVERT sur un compte client — `paid_at` ne gere ni le paiement partiel ni un reglement couvrant plusieurs factures. **`lettering_code` est ABSENT du depot** (0 occurrence) : tout est a construire, rien a defaire. ⚠️ **Quatre questions non tranchees par le PRD** conditionnent le schema et l'ecran, donc a regler A LA SPECIFICATION : lettrage partiel ou non, propose ou manuel (cf. la regle « un appariement automatique propose, il ne cree jamais »), sort d'un lettrage A CHEVAL sur deux exercices, et depuis quel ecran. ⛔ **La revue de projet N'A PAS eu lieu** — le `CLAUDE.md` l'impose apres la retrospective ; la derniere date du 2026-08-19. Ce kickoff repose donc sur le seul arbitrage de Guy.
  15-1-lettrage: split  # 2026-08-25 **DECOUPEE EN 15-1a / 15-1b / 15-1c** — decision du Project Lead apres que la passe 3 de validate eut declenche le critere de NON-CONVERGENCE de la Regle de splitting preventif (MED en passe 2 -> HIGH en passe 3). CORPS VIDE, il ne reste que les pointeurs et l'historique des passes (definition du statut `split` ; precedent 17-2). ⚠️ SEPT decisions de fond sont restees OUVERTES au split et sont reportees dans la sous-story qui les porte — aucune ne se tranche a l'implementation.  # 2026-08-25 ⛔ **PASSE 3 DE VALIDATE (Opus) : LA SEVERITE REMONTE — MED (P2) -> HIGH (P3)**, 4 HIGH + 4 MED + 3 LOW. **LE CRITERE DE NON-CONVERGENCE DE LA REGLE DE SPLITTING PREVENTIF EST DECLENCHE** ; l'arbitrage du decoupage revient au Project Lead, PAS a l'orchestrateur — rien n'est splitte a ce stade. Pourquoi les passes 1 et 2 n'avaient rien vu : elles relisaient la spec contre elle-meme et contre le SCHEMA, aucune n'a suivi les CHEMINS DE CODE qui ecrivent, effacent ou soldent les lignes. Les quatre HIGH : (1) `update` d'ecriture fait DELETE+INSERT des lignes et PERD le code (`journal_entries.rs:981`) — AC12 n'a tranche que la suppression ; (2) la garde d'AC12 est posee sur la route alors que `invoices::delete` passe par `delete_in_tx` (`invoices.rs:1338`) ; (3) balance agee et relances ne lisent que `paid_at` (0 occurrence de `lettering` au depot) — ON RELANCERA UN DEBITEUR SOLDE ; (4) le § Contexte est FAUX sur les fournisseurs, qui ont deja `pay()` + `settlement_type` hors import + DEUX ecritures par facture payee. ⚠️ **Deux regressions de mes propres patches, corrigees** : l'unicite `(company_id, lettering_code)` proposee en passe 2 est impossible (pas de `company_id` sur la table) ET casserait AC1 ; et la reference « corrigee » en passe 1 etait ENCORE fausse (1313, pas 1328). Passe 4 due APRES arbitrage du split. # 2026-08-25 **PASSE 2 DE VALIDATE** (Haiku, contexte frais) — 0 HIGH, 1 MED, 4 LOW dont DEUX REFUTES au sol. Severite decroissante (HIGH -> MED) = convergence MONOTONE, le critere de split n'est pas declenche. Aucune regression des patches de la passe 1. AC12 TRANCHE (la suppression d'une ecriture lettree est REFUSEE — le delettrage auto contournerait AC7). ⚠️ **Refutes, ne pas les rouvrir** : multi-devise (`journal_entry_lines` n'a AUCUNE colonne de devise, le PRD ignore le mot) et arrondis (`DECIMAL(19,4)` est exact, pas flottant). Passe 3 due : un MED subsiste. ⛔ **PASSE 1 DE VALIDATE : SPEC NON PRETE POUR LE DEV** (Sonnet, contexte frais) — 2 HIGH, 1 MED, 1 LOW, tous verifies au sol par l'orchestrateur avant application. **NE PAS LANCER `dev-story` SUR CETTE LIGNE** : le statut `ready-for-dev` dit seulement que le fichier de story existe (cf. STATUS DEFINITIONS l. 30), il ne dit RIEN de la validation — et aucun statut du bloc ne distingue « specifiee » de « validee ». Passe 2 due : modele different, contexte frais. # 2026-08-24 **SPEC CREEE** — `15-1-lettrage.md`, six decisions (D1-D6) et QUINZE criteres (dix a la creation, +4 a la relecture du 2026-08-25, +1 = AC13 en passe 1 de validate). ⚠️ **Deux endroits ou une implementation plausible se TROMPE, et les tests doivent y aller en premier** : **(a) AC3 / D4** — une facture reglee par la RECONCILIATION porte `paid_at` SANS etre lettree ; un ecran qui ne regarderait que `lettering_code` l'afficherait OUVERTE, sur le chemin le plus frequent. « Ouvert » = ni lettre ni marque paye. **(b) AC7 / AC8** — la cloture est ASYMETRIQUE : lettrer reste autorise sur un exercice clos, deletter non. ⚠️ **D1 tranche « ligne ou ecriture » par le FOND** : le lettrage porte sur un COMPTE, et une ecriture de vente en touche trois (client, produit, TVA) — « cette ecriture est lettree » n'a aucun sens comptable, et un code sur l'ecriture rendrait la vue « ouvert sur le compte 1100 » incalculable. Le benefice pour un futur lettrage partiel n'est PAS la justification. ⚠️ **D5 AMENDEE en passe 1 de validate (2026-08-25) — la formulation ci-dessous etait FAUSSE et il faut la lire jusqu'au bout** : les criteres de la reconciliation ne se transposent PAS tous. Se reprennent les criteres STRUCTURELS (meme compte, sens opposes, fenetre +/-30 j, montants EGAUX) ; ne se reprennent PAS `validated` et `paid_at IS NULL`, propres a la table `invoices`, qui excluraient les fournisseurs, les ecritures manuelles et les factures annulees par avoir (`cancelled`) — soit TROIS des quatre cas de la story. La tolerance de 5 centimes est ecartee elle aussi : AC6-bis exige l'egalite stricte, et la garder ferait PROPOSER ce que le systeme REFUSE ensuite. ⚠️ Consequence laissee a l'arbitrage : un reglement ampute de frais bancaires ne sera jamais lettrable. Formulation d'origine, conservee pour la genealogie : « ne pas inventer un second jeu de criteres, ceux de la reconciliation sont eprouves depuis l'Epic 8 » — vrai pour les criteres structurels, faux pour les filtres de facture. Migration `ADD COLUMN` nullable = non-breaking (P1), ligne d'audit obligatoire (P5), exemption `POST_RESTORE_BACKFILLS` avec justification (P7 — elle n'ecrit aucune donnee). Prochaine etape : `bmad-create-story validate` 15-1.  # 2026-08-24 — ex-15-2, passee en TETE au kickoff. FR85, FR86. **QUATRE DECISIONS de Guy, normatives** : **D1** le lettrage COMPLETE la reconciliation, il ne la remplace pas — `accept_one_invoice` (`kesh-api/src/routes/reconciliation.rs:1003-1313`) couvre DEJA « facture reglee par virement importe », en proposant et faisant valider ; le lettrage vise les reglements HORS import (especes, compensation), les FOURNISSEURS, les ecritures manuelles, et la vue « ce qui reste ouvert ». ⚠️ **Consequence a ne pas decouvrir en dev : la vue doit lire les DEUX mecanismes** — une facture reglee par la reconciliation porte `paid_at` SANS etre lettree, et un ecran qui ne regarderait que `lettering_code` l'afficherait OUVERTE, mentant la ou il doit informer. « Ouvert » = ni lettre ni marque paye, et c'est un critere. **D2** un lettrage = une facture = un reglement : ni partiel ni groupe au debut ⚠️ le groupe est COURANT chez un client regulier, ses factures resteront affichees ouvertes — a dire dans le manuel, a rouvrir des que l'usage le demande. **D3** lettrer sur exercice CLOTURE : OUI (le lettrage ne modifie aucun montant) ; deletter : NON. ⚠️ C'est D3, et non « clore quand il n'y a plus d'ecritures », qui rend le lettrage a cheval possible — une creance ouverte au 31.12 est NORMALE, elle figure au bilan ; attendre que tout soit regle reviendrait a ne jamais cloturer. **D4** ecran dedie (modele Bexio) ⚠️ il ressemblera a celui de la reconciliation : leur frontiere doit etre lisible pour l'UTILISATEUR. Trois questions residuelles pour la spec : criteres de proposition, lettrage sur la ligne ou l'ecriture, contenu de l'ecran.
  15-1a-socle-lettrage: ready-for-dev  # 2026-08-25 ✅ **PASSE 4 : CONVERGENCE** (Sonnet, contexte frais) — 1 seul finding, LOW. Critere d'arret de la Review Iteration Rule atteint. Trajectoire : 2 HIGH -> 2 MED -> 1 CRIT + 2 HIGH -> 1 LOW. Quatre passes, modeles Sonnet/Haiku/Opus/Sonnet, contexte frais a chaque fois. La passe 4 a relu `update` EN ENTIER pour verifier la correction du CRITICAL par la passe 3 : la clause (ii) d'AC7 est implementable sans conflit, `is_no_op_change` reste ENTIERE pour le court-circuit KF-004 (c'est une SECONDE fonction qui pilote la clause), le comparateur de lignes est exhaustif vis-a-vis de `NewJournalEntryLine`, et aucun chemin ne fait survivre une marque a une modification qui aurait du la detruire. ⛔ **DEUX DECISIONS DU PROJECT LEAD BLOQUENT LE DEV, et `ready-for-dev` ne dit rien d'elles** : le PORTEUR de la marque (colonne `lettering_code` ou table `letterings` — (B) transpose le gap lock eprouve, garde un filet UNIQUE, et fournit gratuitement `created_at`/`created_by` dont AC13 a besoin) et son FORMAT (il se fige a la migration, P8 interdit d'y revenir). ⚠️ Restriction assumee a connaitre : modifier une ligne NON lettree dans une ecriture qui en compte trois dont une seule est lettree est refuse aussi — consequence directe du DELETE/INSERT global. 14 criteres. # 2026-08-25 ⛔ **PASSE 3 DE VALIDATE (Opus) : 1 CRITICAL, 2 HIGH, 4 MED, 2 LOW** — trajectoire HIGH -> MED -> CRITICAL. ⚠️ **Le critere de non-convergence se declenche une SECONDE fois, mais il ne commande PAS un re-split** : 15-1a est ETROITE, ce n'est pas un defaut de largeur — c'est que la passe 2 a TRANCHE UNE REGLE METIER SUR UN FAIT QU'ELLE N'AVAIT PAS VERIFIE. Remede cible, pas structurel. **P3-1 (CRITICAL)** : la conduite de la passe 2 (« en-tete modifiable ») DETRUISAIT la marque sur le chemin qu'elle ouvrait — le DELETE de `update` (`journal_entries.rs:981`) n'est garde que par le no-op COMPLET, donc modifier un libelle efface les lignes et la contrepartie garde la sienne. → AC7 clause (ii) : lignes inchangees = `update` NE TOUCHE PAS aux lignes. **P3-2 (HIGH)** : l'argument (1) de la passe 2 etait FAUX — une ecriture sur exercice clos est DEJA immuable (`journal_entries.rs:892`) ; un dev ecrivant le test depuis ce texte aurait pu conclure que la garde de cloture est l'obstacle ET L'ASSOUPLIR. **P3-3 (HIGH)** : LE SPLIT AVAIT LAISSE TOMBER L'EGALITE DES MONTANTS — garde dans 15-1c, route d'ecriture dans 15-1a ; 15-1a+b mergees sans 15-1c, on appariait 1000 avec 300. → AC12. MED : T7 sous-comptait les messages (3 annonces, 4 manquants) ; le FORMAT de la marque n'etait fixe nulle part alors que P8 interdit d'y revenir ; `reset_demo` n'est refute que pour la conduite (A) ; aucune trace d'audit alors qu'AC5 autorise une ecriture sur exercice CLOS. → AC13. ⚠️ Refute et rassurant : changer la DATE ne peut PAS deplacer une ecriture d'exercice (`update` ne reecrit jamais `fiscal_year_id`). 11 -> 14 criteres. Passe 4 due. # 2026-08-25 **PASSE 2 DE VALIDATE** (Haiku, contexte frais) — 0 HIGH, 2 MED, 1 LOW, les trois sur LE MEME point. Severite decroissante (HIGH -> MED), aucune regression des patches de la passe 1. ⚠️ **AC7 disait « a trancher a la specification et non a l'implementation » PUIS NE TRANCHAIT PAS** — mot pour mot le defaut releve sur AC12 de la story mere, reproduit dans la story nee de ce releve. **TRANCHE** : la modification est REFUSEE si elle change les LIGNES d'une ecriture lettree, l'EN-TETE reste modifiable. Deux faits au sol l'imposent : (1) un refus global figerait l'ecriture jusqu'a son libelle, car `update` reecrit TOUJOURS les lignes et le delettrage est interdit sur exercice clos (AC6) — une ecriture lettree sur exercice clos deviendrait immuable, description comprise ; (2) preserver la marque a travers le DELETE/INSERT n'est pas fiable, la reinsertion numerote PAR POSITION et la marque atterrirait sur la mauvaise ligne, PIRE qu'une marque perdue car plausible. ⚠️ Cette conduite n'etait dans AUCUNE des deux options offertes, et elle n'invente rien : `is_no_op_change` (`journal_entries.rs:782`) compare deja l'en-tete PUIS les lignes — sa seconde moitie EST la garde. Regle aussi la renumerotation sans clause dediee. Passe 3 due. # 2026-08-25 **PASSE 1 DE VALIDATE** (Sonnet, contexte frais) — 2 HIGH, 1 MED, 1 LOW, tous verifies au sol. ⚠️ **Resultat POSITIF a noter** : la passe a REFAIT le recensement des chemins d'ecriture en independant et le confirme EXHAUSTIF (`create`, `update`, le wipe de `reset_demo`, rien d'autre ; aucun appelant de `update`/`delete_in_tx` hors les deux routes et `invoices::delete`). **PA-1 (HIGH) est le finding qui compte** : aucun critere ne refusait de lettrer une ligne DEJA lettree — re-apparier ecrase la marque et laisse l'ancien partenaire SEUL, repute solde a vie, sans que rien ne le signale. C'est une porte que LE LETTRAGE OUVRE LUI-MEME, la ou les passes precedentes n'avaient ferme que les chemins par lesquels un AUTRE dispositif detruit la marque — aucune des quatre passes de la story mere ne l'avait vu. PA-3 (MED) : garde IDOR manquante sur la societe de l'appelant. PA-2 (HIGH) : (A) et (B) n'offrent pas la meme garantie sur l'unicite — (B) transpose le gap lock eprouve ET garde un filet UNIQUE, (A) doit verrouiller par jointure SANS aucun filet de schema ; input d'arbitrage, pas blocage. 9 -> 11 criteres. Passe 2 due. # 2026-08-25 **CREEE AU SPLIT de la 15-1**. SOCLE — 15-1b et 15-1c la supposent livree. Porte la marque de lettrage, sa portee societe, son unicite SOUS CONCURRENCE, et surtout son CYCLE DE VIE face aux chemins d'ecriture existants. ⚠️ **Les deux HIGH de la passe 3 sont ici** : (1) `update` d'une ecriture fait DELETE+INSERT de ses lignes (`journal_entries.rs:981`) et PERD la marque, laissant la contrepartie reputee soldee ; (2) la garde de suppression doit se poser sur `delete_in_tx` et NON sur la route, car `invoices::delete` passe par la (`invoices.rs:1338`) et aucune de ses trois gardes ne regarde le lettrage. ⛔ **DECISION OUVERTE bloquant le dev** : porteur de la marque — colonne `lettering_code` ou table `letterings`. Le moyen d'unicite propose en passe 2 (UNIQUE (company_id, lettering_code)) est IMPOSSIBLE : `journal_entry_lines` n'a aucun `company_id`, et la contrainte interdirait deux lignes portant le meme code. ⚠️ Migration non-breaking (P1), ligne d'audit P5 obligatoire, mais PAS d'exemption P7 (le detecteur ne trie que les migrations qui ecrivent des donnees). Gate `kesh-db` complet, jamais cible.
  15-1b-vue-lignes-ouvertes: backlog  # 2026-08-25 **CREEE AU SPLIT de la 15-1**. Suppose 15-1a livree. La vue « ce qui reste ouvert » et sa relation aux dispositifs qui lisent DEJA `paid_at`. ⚠️ **Les deux autres HIGH de la passe 3** : (3) balance agee (`aged_receivables.rs:127`) et relances (`dunning_eligibility.rs:87`) ne lisent que `paid_at`, et `lettering` a ZERO occurrence au depot — ON RELANCERA UN DEBITEUR SOLDE, et ce defaut-la n'est pas muet, il est ADRESSE AU CLIENT ; (4) le § Contexte de la 15-1 etait FAUX sur les fournisseurs, qui ont deja `pay()`, un `settlement_type` couvrant le hors-import, et DEUX ecritures par facture payee — une jointure qui n'en voit qu'une laisse la ligne de reglement ouverte A JAMAIS. ⛔ **QUATRE decisions ouvertes** : ce que lettrer change pour la relance ; ce que la vue pretend egaler (cote client `paid_at` ne cree AUCUNE ecriture, `invoices.rs:1923` — le compte 1100 porte des debits jamais credites) ; la portee de la garantie sur exercice clos (`mark_as_paid` n'a AUCUNE garde d'exercice) ; et le traitement des deux ecritures fournisseur.
