  23-3-supplier-invoices: done  # 2026-08-22 **CLOTUREE RETROACTIVEMENT** — PR #325 mergee le 2026-08-20. ⚠️ **Elle etait restee en `review` a juste titre** : sa passe 5 rendait encore 2 HIGH / 3 MEDIUM / 1 LOW, donc le critere d'arret de la Review Iteration Rule n'etait pas atteint au merge. ⚠️ **Mais ses deux HIGH ont ete EXTERNALISES** — ils etaient la decouverte que le defaut de la passe 4 existait a l'identique dans `payment-batches` et `credit-notes`, et sont devenus la story **23-3b** (arbitrage de Guy : « je ne veux pas laisser trainer ce genre de probleme »). La 23-3b est `done` et mergee (PR #327) ; les autres findings, qui visaient des comptes rendus, ont ete corriges sur place. **Plus aucun finding de la 23-3 n'est ouvert** — le statut n'avait simplement jamais ete referme, alors que la 23-2 et la 23-3b ont chacune recu leur commit de cloture.  # 2026-08-19 **IMPLEMENTEE** — **113 cles x 4 locales** (et non 109 : la resolution des conflits en a cree 4 ; recompte confirme par la garde qui a signale **339 = 113 x 3** manquantes). ⚠️ **LE MOISSONNEUR A TROUVE UN DEFAUT APPLICATIF, pas une dette** : `supplier-invoices-col-total` servait TROIS sites avec deux replis, « TTC » sur `invoice.totalAmount` (documente *TTC (Somme HT + Somme TVA)*, supplier_invoice.rs:29) et « Total HT » sur `line.lineTotal` (documente *quantity x unit_price (HT)*, :89) — DEUX GRANDEURS sous une cle unique. ⚠️ **Le bug etait LATENT et c'est la TRADUCTION qui l'aurait active** : tant que la cle manque des 4 catalogues, `i18nMsg` retombe sur le repli DU SITE APPELANT et chaque ecran affiche le bon libelle, par accident ; une valeur unique au catalogue s'impose aux trois sites — « TTC » au-dessus de montants HORS TAXE, sur une facture fournisseur. Scindee en `-col-total` / `-line-total`. **Ce cas justifie a lui seul que le moissonneur SIGNALE les conflits au lieu de choisir** (decision 23-1b) : un choix silencieux aurait fait entrer le defaut sans que personne ne le voie. **QUATRE confl