  23-1a-mecanisme-gardes-i18n: done  # 2026-08-19 **CLÔTURÉE** — 4 passes de `bmad-code-review` (Sonnet, Haiku, Opus, puis une passe CIBLÉE à lentille unique), trend `4 HIGH -> 1 -> 3 -> 1`. ⚠️ **Motif de la boucle** : CHACUNE des quatre passes a trouvé une régression du PATCH PRÉCÉDENT, jamais un défaut de la conception initiale — le code d'origine a tenu, ce sont les correctifs qui ont cassé. Les trois derniers HIGH étaient DORMANTS (aucun n'a fait bouger un compteur). Arrêt fondé sur une vérification indépendante : deux oracles AST (TypeScript + compilateur Svelte) sur 277 fichiers, **zéro écart** sur les sites d'appel comme sur les commentaires. Gate complet final : backend **2219/2219** (base remise à zéro), frontend check 0 erreur / lint PASS / **645 tests** / build vert. # 2026-08-19 **IMPLÉMENTÉE, LES DEUX GATES COMPLETS VERTS** (backend 2219/2219 après remise à zéro inconditionnelle de la base ; frontend check 0 erreur / lint PASS / 626 tests / build). ⚠️ **Le lecteur réel a CORRIGÉ LA SPEC** : 36 sites non résolus sur 1496, contre 54 sur 1514 annoncés — l'estimation par regex comptait les définitions de relais et des mentions en commentaire. **Les deux gardes ont été MUTÉES**, six mutations, toutes rouges — dont la création d'un site d'indirection NEUF, qui fait rougir 3 tests sur 7 : c'est la garantie de D4-ter vérifiée plutôt que postulée. Le piège annoncé par la passe 3 s'est produit tel quel (la garde a rougi sur les 6 clés de l'inventaire, inscrites à la dette mais introuvables parmi les demandées) — résolu en déclarant `FAMILLES_RESOLUES`, l'étape 4 de D4-ter, et non en retirant les lignes.  # 2026-08-19 (nuit) **PASSE 1 `bmad-code-review` — 0 CRITICAL, 4 HIGH, 5 MEDIUM, 5 LOW** (Sonnet x3, contextes frais). **Aucun des defauts n'etait visible depuis les tests, qui passaient tous.** ⚠️ **Les deux HIGH d'acceptation me visent** : AC7-quater n'etait PAS satisfait — aucune assertion de cardinalite sur les 7 relais — **et j'avais coche la case** ; la col